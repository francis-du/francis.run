name: GitHub Pages

on:
  push:
    branches:
      - master  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive  # Match Cloudflare and include nested theme dependencies
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.166.0'  # current stable Hugo; keep in sync with production
          extended: true           # retained for gallery Sass compatibility; WebP itself no longer requires Extended

      - name: Cache Hugo resources
        uses: actions/cache@v6.1.0
        with:
          path: .cache/hugo
          key: hugo-${{ runner.os }}-0.166.0-${{ hashFiles('hugo.toml', '.gitmodules') }}
          restore-keys: |
            hugo-${{ runner.os }}-0.166.0-

      - name: Verify and build
        run: make check HUGO_CACHE_DIR=${{ github.workspace }}/.cache/hugo

      - name: Copy CNAME
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cp ./CNAME ./target-hugo-check

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.SITE_DEPLOY_KEY }}
          publish_dir: ./target-hugo-check
