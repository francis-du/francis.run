{{ $pag := $.Paginator }}
{{ if gt $pag.TotalPages 1 }}
<nav class="pagination-nav" aria-label="{{ i18n "paginationNavigation" }}">
<ul class="pagination">
	<li class="page-item page-prev">
	{{ if $pag.HasPrev }}
    <a {{ if $pag.HasPrev }}href="{{ $pag.Prev.URL }}"{{ end }} class="page-link" aria-label="{{ i18n "previousPage" }}"><span aria-hidden="true">← {{ i18n "previousPage" }}</span></a>
	{{ end }}
	</li>
	<li class="page-item page-next">
	{{ if $pag.HasNext }}
    <a {{ if $pag.HasNext }}href="{{ $pag.Next.URL }}"{{ end }} class="page-link" aria-label="{{ i18n "nextPage" }}"><span aria-hidden="true">{{ i18n "nextPage" }} →</span></a>
	{{ end }}
	</li>
</ul>
</nav>
{{ end }}
