{{- $toc := .Fragments.ToHTML 2 3 false -}}
{{- $headingCount := len (findRE "<a " $toc) -}}
{{- if ge $headingCount 4 -}}
<details class="article-toc">
	<summary><span id="article-toc-heading">{{ i18n "articleToc" }}</span><small>{{ printf (i18n "articleTocSections") $headingCount }}</small></summary>
	<div class="article-toc-body">
		{{ replace $toc "<nav id=\"TableOfContents\">" "<nav id=\"TableOfContents\" aria-labelledby=\"article-toc-heading\">" | safeHTML }}
	</div>
</details>
{{- end -}}
