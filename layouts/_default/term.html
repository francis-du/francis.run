<!DOCTYPE html>
<html>
{{ partial "header.html" . }}

<body>
	<div class="container wrapper list tags">
		{{ partial "head.html" . }}

		<div class="page-heading">
			<span class="eyebrow">Tag</span>
			<h1 class="page-title"># {{ .Title }}</h1>
			<p>共 {{ len .Pages }} 篇文章</p>
		</div>

		<ul class="posts flat">
			{{ range .Pages.ByDate.Reverse }}
			<li class="post">
				{{ partial "post-preview.html" . }}
			</li>
			{{ end }}
		</ul>
	</div>

	{{ partial "footer.html" . }}
</body>
</html>
