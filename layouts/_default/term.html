<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "zh-CN" }}">
{{ partial "header.html" . }}

<body>
	<div class="container wrapper list tags">
		{{ partial "head.html" . }}

		<main id="main-content">
		<div class="page-heading">
			<span class="eyebrow">{{ i18n "tag" }}</span>
			<h1 class="page-title"># {{ .Title }}</h1>
			<p>{{ printf (i18n "articleCount") (len .Pages) }}</p>
		</div>

		<ul class="posts flat">
			{{ range .Pages.ByDate.Reverse }}
			<li class="post">
				{{ partial "post-preview.html" . }}
			</li>
			{{ end }}
		</ul>
		</main>
	</div>

	{{ partial "footer.html" . }}
</body>
</html>
