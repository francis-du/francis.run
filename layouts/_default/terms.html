<!DOCTYPE html>
<html>
{{ partial "header.html" . }}

<body>
	<div class="container wrapper tags">
		{{ partial "head.html" . }}

		<div class="page-heading">
			<span class="eyebrow">Explore</span>
			<h1 class="page-title">{{ .Name }}</h1>
			<p>按主题浏览文章</p>
		</div>

		<div class="tag-cloud">
		{{ range .Data.Terms.ByCount }}
			<a href="{{ .Page.RelPermalink }}"><span># {{ .Page.Title }}</span><small>{{ .Count }} 篇</small></a>
		{{ end }}
		</div>
	</div>

	{{ partial "footer.html" . }}
</body>
</html>
