baseURL = "https://francis.run/"
title = "Francis Du"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
enableMissingTranslationPlaceholders = false
timeZone = "Asia/Shanghai"
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
ignoreLogs = ['warning-goldmark-raw-html']
timeout = 600000
copyright = "© Francis Du"

# Keep expensive image transforms inside Hugo's portable cache directory.
# Cloudflare Pages persists .cache between builds when build caching is enabled.
[caches]
    [caches.assets]
    dir = ':cacheDir/assets'
    [caches.images]
    dir = ':cacheDir/images'

# Keep the gallery submodule as an asset source, but publish only the
# minified runtime files used by the local gallery shortcode.
[module]
    [module.hugoVersion]
    min = '0.165.0'

    [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
    [[module.mounts]]
    source = 'assets'
    target = 'assets'
    [[module.mounts]]
    source = 'content'
    target = 'content'
    [[module.mounts]]
    source = 'data'
    target = 'data'
    [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
    [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
    [[module.mounts]]
    source = 'static'
    target = 'static'
    files = ['! 404.html', '! js/gallery.js']
    # Expose static images to the asset pipeline as a metadata-only view so
    # Markdown render hooks can emit intrinsic dimensions without changing URLs.
    [[module.mounts]]
    source = 'static/img'
    target = 'assets/img'
    [[module.mounts]]
    source = 'themes/hugo-shortcode-gallery/static/shortcode-gallery'
    target = 'static/shortcode-gallery'
    files = [
        'jquery-3.7.1.min.js',
        'swipebox/css/swipebox.min.css',
        'swipebox/js/jquery.swipebox.min.js',
        'swipebox/img/icons.png',
        'swipebox/img/icons.svg',
        'swipebox/img/loader.gif',
        'justified_gallery/jquery.justifiedGallery.min.js',
        'justified_gallery/justifiedGallery.min.css'
    ]

[markup.highlight]
style = "vs"
codeFences = true
guessSyntax = true

# 允许原始 HTML
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
    block = true

[params]
    subtitle = "Blog"
    description = "💻 Data Engineer | 🦀 Rustacean | 📷 Photographer | 🤖 Vibe Coder"
    avatar = "https://avatars.githubusercontent.com/u/25944814?s=132&v=4"
    favicon = "img/icon.png"
    title = "Francis Blog"
    mode = "dark"
    images = ["/img/share-default.png"]
    social_share = true
    comment = true
    # Keep hugo-shortcode-gallery's Swipebox + JustifiedGallery lifecycle.
    # Browser-native lazy loading replaces jquery.lazy; generated WebP derivatives avoid source-photo transfer.
    galleryRowHeight = 200
    galleryRowMargins = 5
    galleryImageResizeOptions = "1920x1920 webp q82 Lanczos"
    galleryThumbnailResizeOptions = "720x720 webp q78 Lanczos"
    galleryPreviewType = "none"
    galleryThumbnailHoverEffect = "none"
    galleryShowExif = true
    galleryLoadJQuery = true
    galleryEmbedPreview = false
    gallerySwipeboxParameters = "removeBottomBarOnMobile: false"


[imaging.meta]
    sources = ['exif', 'iptc']

# Keep RSS full-content, but bound every feed to recent entries so taxonomy
# feeds do not duplicate the entire publication archive indefinitely.
[services]
    [services.rss]
    limit = 20

[outputs]
home = ['html', 'rss', 'json']
    
[pagination]
pagerSize = 10
disableAliases = true

[params.author]
name = "Francis Du"

