[permalinks]
    [permalinks.page]
    blogs = '/blog/:contentbasename/'

[related]
includeNewer = true
threshold = 30
toLower = true
    [[related.indices]]
    name = 'tags'
    weight = 100
    [[related.indices]]
    name = 'fragmentrefs'
    type = 'fragments'
    applyFilter = true
    weight = 40
    [[related.indices]]
    name = 'date'
    pattern = '2006'
    weight = 15

[taxonomies]
tags = "tags"
